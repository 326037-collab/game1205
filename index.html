        wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            let line = '';
            let curY = y;
            for (let i = 0; i < text.length; i++) {
                const testLine = line + text[i];
                if (ctx.measureText(testLine).width > maxWidth && i > 0) {
                    ctx.fillText(line, x, curY);
                    line = text[i];
                    curY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, curY);
        }

        getGridCellCenter(r, c) {
            return {
                x: this.gridX + c * (this.cellW + this.cellGap) + this.cellW / 2,
                y: this.gridY + r * (this.cellH + this.cellGap) + this.cellH / 2
            };
        }

        getGridSlotAt(px, py) {
            for (let r = 0; r < this.gridRows; r++) {
                for (let c = 0; c < this.gridCols; c++) {
                    const x = this.gridX + c * (this.cellW + this.cellGap);
                    const y = this.gridY + r * (this.cellH + this.cellGap);
                    if (px >= x && px <= x + this.cellW && py >= y && py <= y + this.cellH) {
                        return { row: r, col: c };
                    }
                }
            }
            return null;
        }

        getShopCardAt(px, py) {
            if (this.state !== 'PREP') return -1;
            const cardW = 152;
            const cardH = 190;
            const cardGap = 16;
            const startX = (DESIGN_W - (cardW * 3 + cardGap * 2)) / 2;
            const cardY = this.consoleTop + 48;

            for (let i = 0; i < 3; i++) {
                const cx = startX + i * (cardW + cardGap);
                if (px >= cx && px <= cx + cardW && py >= cardY && py <= cardY + cardH) {
                    return i;
                }
            }
            return -1;
        }

        toLogicalCoords(clientX, clientY) {
            const rect = this.canvas.getBoundingClientRect();
            return {
                x: ((clientX - rect.left) / rect.width) * DESIGN_W,
                y: ((clientY - rect.top) / rect.height) * DESIGN_H
            };
        }

        handlePointerDown(clientX, clientY) {
            sfx.init();
            const pt = this.toLogicalCoords(clientX, clientY);
            this.pointer.x = pt.x;
            this.pointer.y = pt.y;
            this.pointer.down = true;

            // Check UI buttons (in reverse order so top-most modals intercept first)
            for (let i = this.uiButtons.length - 1; i >= 0; i--) {
                const b = this.uiButtons[i];
                if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) {
                    this.onButtonDown(b.id);
                    return;
                }
            }

            // Dragging from Shop Tray (Prep Phase)
            if (this.state === 'PREP') {
                const shopIdx = this.getShopCardAt(pt.x, pt.y);
                if (shopIdx !== -1 && this.shopCards[shopIdx]) {
                    const card = this.shopCards[shopIdx];
                    if (this.coins >= card.cost) {
                        this.draggedUnit = {
                            source: 'shop',
                            shopIdx,
                            unit: this.createUnit(card.typeId, 1),
                            x: pt.x,
                            y: pt.y
                        };
                        sfx.playClick(540);
                    } else {
                        this.spawnFloatingText(pt.x, pt.y - 20, 'コインが足りません！', '#f87171', 17);
                        sfx.playClick(200);
                    }
                    return;
                }
            }

            // Dragging an existing unit on the 4x4 Grid (Allowed in Prep & Combat!)
            if (this.state === 'PREP' || this.state === 'COMBAT') {
                const slot = this.getGridSlotAt(pt.x, pt.y);
                if (slot && this.grid[slot.row][slot.col]) {
                    this.draggedUnit = {
                        source: 'grid',
                        row: slot.row,
                        col: slot.col,
                        unit: this.grid[slot.row][slot.col],
                        x: pt.x,
                        y: pt.y
                    };
                    sfx.playClick(580);
                }
            }
        }

        handlePointerMove(clientX, clientY) {
            const pt = this.toLogicalCoords(clientX, clientY);
            this.pointer.x = pt.x;
            this.pointer.y = pt.y;
            if (this.draggedUnit) {
                this.draggedUnit.x = pt.x;
                this.draggedUnit.y = pt.y;
            }
        }

        handlePointerUp() {
            this.pointer.down = false;
            this.overdriveActive = false;

            if (!this.draggedUnit) return;

            const drag = this.draggedUnit;
            this.draggedUnit = null;
            const targetSlot = this.getGridSlotAt(drag.x, drag.y);

            if (!targetSlot) {
                // Quick-tap on a shop card auto-places it into the first open slot!
                if (drag.source === 'shop') {
                    const shopIdxUnder = this.getShopCardAt(drag.x, drag.y);
                    if (shopIdxUnder === drag.shopIdx) {
                        this.autoDeployFromShop(drag.shopIdx);
                    }
                }
                return;
            }

            const { row, col } = targetSlot;
            const occupant = this.grid[row][col];

            // Dropped back onto itself
            if (drag.source === 'grid' && drag.row === row && drag.col === col) {
                return;
            }

            // Case A: Empty target cell -> Deploy or Move
            if (!occupant) {
                if (drag.source === 'shop') {
                    const card = this.shopCards[drag.shopIdx];
                    if (card && this.coins >= card.cost) {
                        this.coins -= card.cost;
                        this.shopCards[drag.shopIdx] = null;
                        this.grid[row][col] = drag.unit;
                        drag.unit.mergePop = 1.32;
                        const pos = this.getGridCellCenter(row, col);
                        this.spawnParticles(pos.x, pos.y, '#38bdf8', 8);
                        sfx.playClick(720);
                    }
                } else {
                    this.grid[row][col] = drag.unit;
                    this.grid[drag.row][drag.col] = null;
                    sfx.playClick(640);
                }
                return;
            }

            // Case B: Occupied cell with IDENTICAL unit & tier -> MERGE!
            if (occupant.typeId === drag.unit.typeId && occupant.tier === drag.unit.tier && occupant.tier < 3) {
                if (drag.source === 'shop') {
                    const card = this.shopCards[drag.shopIdx];
                    if (!card || this.coins < card.cost) return;
                    this.coins -= card.cost;
                    this.shopCards[drag.shopIdx] = null;
                } else {
                    this.grid[drag.row][drag.col] = null;
                }

                occupant.tier += 1;
                occupant.mergePop = 1.48;
                const pos = this.getGridCellCenter(row, col);
                this.spawnParticles(pos.x, pos.y, '#facc15', 16);
                this.spawnFloatingText(pos.x, pos.y - 26, `合体進化！ ${occupant.tier}★`, '#facc15', 20);
                sfx.playMerge(occupant.tier);
                return;
            }

            // Case C: Occupied cell with different unit -> Swap if from grid
            if (drag.source === 'grid') {
                this.grid[row][col] = drag.unit;
                this.grid[drag.row][drag.col] = occupant;
                sfx.playClick(600);
            }
        }

        autoDeployFromShop(shopIdx) {
            const card = this.shopCards[shopIdx];
            if (!card || this.coins < card.cost) return;

            // First check if a mergeable unit already exists on the grid
            for (let r = 0; r < this.gridRows; r++) {
                for (let c = 0; c < this.gridCols; c++) {
                    const u = this.grid[r][c];
                    if (u && u.typeId === card.typeId && u.tier === 1) {
                        this.coins -= card.cost;
                        this.shopCards[shopIdx] = null;
                        u.tier = 2;
                        u.mergePop = 1.48;
                        const pos = this.getGridCellCenter(r, c);
                        this.spawnParticles(pos.x, pos.y, '#facc15', 16);
                        this.spawnFloatingText(pos.x, pos.y - 26, '合体進化！ 2★', '#facc15', 20);
                        sfx.playMerge(2);
                        return;
                    }
                }
            }

            // Otherwise place in first empty slot
            for (let c = 0; c < this.gridCols; c++) {
                for (let r = 0; r < this.gridRows; r++) {
                    if (!this.grid[r][c]) {
                        this.coins -= card.cost;
                        this.shopCards[shopIdx] = null;
                        const u = this.createUnit(card.typeId, 1);
                        u.mergePop = 1.32;
                        this.grid[r][c] = u;
                        const pos = this.getGridCellCenter(r, c);
                        this.spawnParticles(pos.x, pos.y, '#38bdf8', 8);
                        sfx.playClick(720);
                        return;
                    }
                }
            }
        }

        onButtonDown(id) {
            if (id === 'lobby_start') {
                sfx.playClick(780);
                this.state = 'PREP';
            } else if (id === 'refresh') {
                this.rollShop(false);
            } else if (id === 'start_wave') {
                this.startWave();
            } else if (id === 'overdrive') {
                if (this.state === 'COMBAT') {
                    this.overdriveActive = true;
                    sfx.playClick(880);
                }
            } else if (id === 'speed') {
                this.gameSpeed = this.gameSpeed === 1 ? 2 : 1;
                sfx.playClick(700);
            } else if (id === 'mute') {
                sfx.muted = !sfx.muted;
                if (!sfx.muted) sfx.playClick(700);
            } else if (id === 'pause') {
                if (this.state === 'PREP' || this.state === 'COMBAT') {
                    this.prevState = this.state;
                    this.state = 'PAUSED';
                    this.overdriveActive = false;
                    sfx.playClick(500);
                }
            } else if (id === 'resume') {
                this.state = this.prevState;
                sfx.playClick(650);
            } else if (id === 'restart_lobby' || id === 'confirm_end') {
                sfx.playClick(600);
                this.resetRun();
                this.state = id === 'confirm_end' ? 'PREP' : 'LOBBY';
            } else if (id.startsWith('upgrade_')) {
                const idx = parseInt(id.split('_')[1], 10);
                if (this.levelUpChoices[idx]) {
                    this.selectUpgrade(this.levelUpChoices[idx]);
                }
            } else if (id === 'reroll_upgrade') {
                if (this.coins >= 15) {
                    this.coins -= 15;
                    this.rollLevelUpCards();
                    sfx.playClick(740);
                } else {
                    sfx.playClick(200);
                }
            }
        }

        bindEvents() {
            window.addEventListener('resize', () => this.resize());

            this.canvas.addEventListener('mousedown', (e) => {
                if (e.button === 0) this.handlePointerDown(e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', (e) => {
                this.handlePointerMove(e.clientX, e.clientY);
            });
            window.addEventListener('mouseup', () => {
                this.handlePointerUp();
            });

            this.canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (e.touches.length > 0) {
                    this.handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    this.handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: false });

            window.addEventListener('touchend', () => {
                this.handlePointerUp();
            });
        }

        resize() {
            const rect = this.canvas.parentElement.getBoundingClientRect();
            this.dpr = Math.min(window.devicePixelRatio || 1, 2);
            this.canvas.width = DESIGN_W * this.dpr;
            this.canvas.height = DESIGN_H * this.dpr;
            this.canvas.style.width = `${rect.width}px`;
            this.canvas.style.height = `${rect.height}px`;
        }
    }

    // =========================================================================
    // 8. BOOTSTRAP & 60 FPS REQUESTANIMATIONFRAME LOOP
    // =========================================================================
    window.onload = function () {
        const canvas = document.getElementById('gameCanvas');
        const game = new Game(canvas);

        let lastTime = performance.now();
        function gameLoop(now) {
            const rawDt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            // Clear dynamic UI button hitboxes each frame before rendering
            game.uiButtons = [];
            game.update(rawDt);
            game.render();

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    };
    </script>
</body>
</html>
